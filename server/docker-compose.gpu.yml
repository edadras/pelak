# NVIDIA GPU workers (requires nvidia-container-toolkit):
#   TORCH_INDEX=https://download.pytorch.org/whl/cu121 docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  worker:
    environment:
      DEVICE: cuda
      WORKER_MAX_CAMERAS: ${WORKER_MAX_CAMERAS:-32}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
